<!DOCTYPE html>
<html lang="en">
    <head>
        <title>NuruWomen · Women's Health Commons Africa</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link
            rel="icon"
            type="image/svg+xml"
            href="/favicon.svg"
        >

        <!-- Referrer Policy: Prevents private question URLs from leaking to external websites -->
        <meta name="referrer" content="no-referrer">

        <!-- Production CSP; no inline scripts or eval. Relay connections are
            limited to the app's configured Nostr relays (src/lib/appRelays.ts). -->
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss://relay.ditto.pub wss://relay.dreamith.to wss://relay.primal.net wss://nos.lol; object-src 'none'; base-uri 'self'; frame-src 'none';">

        <meta name="description" content="A privacy-first, open women's health knowledge commons for Africa. Questions, lived experience, and evidence, clearly separated, never mixed up.">
        <meta property="og:type" content="website">
        <meta property="og:title" content="NuruWomen · Women's Health Commons Africa">
        <meta property="og:description" content="Ask sensitive women's health questions anonymously. Stories, clinical responses, and evidence, clearly separated.">
        <meta property="og:url" content="https://nuruwomen.shakespeare.wtf/">
        <meta property="og:image" content="https://nuruwomen.shakespeare.wtf/og-image.svg">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="NuruWomen · Women's Health Commons Africa">
        <meta name="twitter:description" content="Ask sensitive women's health questions anonymously. Stories, clinical responses, and evidence, clearly separated.">
        <meta name="twitter:image" content="https://nuruwomen.shakespeare.wtf/og-image.svg">

        <link rel="manifest" href="/manifest.webmanifest">
        <meta name="theme-color" content="#7c2942">
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
