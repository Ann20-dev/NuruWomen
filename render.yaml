services:
  - type: web
    name: nuruwomen
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: WHC_DEMO_MODE
        value: "true"
      - key: AI_SERVICE_URL
        value: http://127.0.0.1:8000
      - key: WHC_API_KEY
        generateValue: true
